<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e7">
  <title>邮箱注册 / 登录 · Ad Fontes</title>
  <style>
    :root { color-scheme: light dark; --paper:#f6f1e7; --ink:#201c17; --muted:#6b6157; --line:#d9cfbe; --accent:#8c2b1f; --card:#fbf8f1; }
    @media (prefers-color-scheme: dark) { :root { --paper:#16130f; --ink:#e9e2d4; --muted:#a79c8b; --line:#332c22; --accent:#d8695a; --card:#1d1913; } }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:28px; background:var(--paper); color:var(--ink); font-family:Georgia,"Noto Serif SC",serif; }
    main { width:min(100%, 440px); padding:clamp(28px, 7vw, 54px); border:1px solid var(--line); background:var(--card); }
    .wordmark { margin:0 0 36px; color:var(--accent); font:600 12px/1.5 Arial,sans-serif; letter-spacing:.18em; }
    h1 { margin:0; font-size:clamp(25px,5vw,32px); font-weight:500; letter-spacing:.03em; }
    .intro { margin:12px 0 32px; color:var(--muted); font-size:14px; line-height:1.8; }
    label { display:block; margin:0 0 9px; font:600 12px/1.4 Arial,sans-serif; letter-spacing:.08em; }
    input { width:100%; min-height:48px; padding:12px 13px; border:1px solid var(--line); border-radius:0; background:var(--paper); color:var(--ink); font:16px/1.4 Arial,sans-serif; }
    input:focus { outline:2px solid var(--accent); outline-offset:2px; }
    button { width:100%; min-height:48px; margin-top:18px; border:0; background:var(--accent); color:#fff; font:600 13px/1 Arial,sans-serif; letter-spacing:.06em; cursor:pointer; }
    button:disabled { cursor:wait; opacity:.7; }
    .status { min-height:46px; margin:18px 0 0; color:var(--muted); font:13px/1.7 Arial,sans-serif; }
    .status[data-error="true"] { color:var(--accent); }
    .back { display:inline-block; margin-top:4px; color:var(--muted); font:12px/1.6 Arial,sans-serif; text-decoration-thickness:1px; text-underline-offset:3px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">AD FONTES · 溯源</p>
    <h1>邮箱验证码注册 / 登录</h1>
    <p class="intro">用邮箱验证码注册或登录后进入欧罗巴音乐家年鉴。首次验证会自动注册；其他栏目仍可直接访问。</p>

    <form id="email-form">
      <label for="email">邮箱地址</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" placeholder="name@example.com">
      <button type="submit">发送验证码</button>
    </form>

    <form id="code-form" hidden>
      <label for="code">六位验证码</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required placeholder="000000">
      <button type="submit">验证并进入</button>
      <a class="back" href="/login/" id="change-email">更换邮箱</a>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared/js/ad-fontes-auth-client.js?v=20261009"></script>
  <script>
    (() => {
      const emailForm = document.getElementById("email-form");
      const codeForm = document.getElementById("code-form");
      const emailInput = document.getElementById("email");
      const codeInput = document.getElementById("code");
      const status = document.getElementById("status");
      const storageKey = "ad-fontes-pending-email";

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.dataset.error = isError ? "true" : "false";
      }

      function safeNext() {
        const value = new URLSearchParams(window.location.search).get("next") || "/";
        if (!value.startsWith("/") || value.startsWith("//")) return "/";
        const destination = new URL(value, window.location.origin);
        return destination.origin === window.location.origin
          ? destination.pathname + destination.search + destination.hash
          : "/";
      }

      const client = window.AdFontesAuth?.client;
      if (!client) {
        setStatus("登录组件没有加载成功，请刷新后重试。", true);
        return;
      }

      client.auth.getSession().then(({ data, error }) => {
        if (!error && data.session?.user) window.location.replace(safeNext());
      }).catch(() => {});

      const pendingEmail = sessionStorage.getItem(storageKey);
      if (pendingEmail) {
        emailInput.value = pendingEmail;
        emailForm.hidden = true;
        codeForm.hidden = false;
        setStatus("请输入邮件中的六位验证码。");
      }

      emailForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = emailForm.querySelector("button");
        const email = emailInput.value.trim().toLowerCase();
        button.disabled = true;
        setStatus("正在发送验证码……");
        try {
          const { error } = await client.auth.signInWithOtp({
            email,
            options: { shouldCreateUser: true },
          });
          if (error) throw error;
          sessionStorage.setItem(storageKey, email);
          emailForm.hidden = true;
          codeForm.hidden = false;
          codeInput.focus();
          setStatus("验证码已发送至 " + email + "，请输入邮件中的六位数字。");
        } catch (error) {
          setStatus(error.message || "验证码暂时无法发送，请稍后重试。", true);
        } finally {
          button.disabled = false;
        }
      });

      codeForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = codeForm.querySelector("button[type='submit']");
        const email = sessionStorage.getItem(storageKey) || emailInput.value.trim().toLowerCase();
        const token = codeInput.value.trim();
        button.disabled = true;
        setStatus("正在验证……");
        try {
          const { data, error } = await client.auth.verifyOtp({ email, token, type: "email" });
          if (error) throw error;
          if (!data.session) throw new Error("登录状态没有建立，请重新发送验证码。");
          sessionStorage.removeItem(storageKey);
          window.location.replace(safeNext());
        } catch (error) {
          setStatus(error.message || "验证码无效或已过期，请检查后重试。", true);
        } finally {
          button.disabled = false;
        }
      });

      document.getElementById("change-email").addEventListener("click", (event) => {
        event.preventDefault();
        sessionStorage.removeItem(storageKey);
        codeForm.hidden = true;
        emailForm.hidden = false;
        codeInput.value = "";
        setStatus("");
        emailInput.focus();
      });
    })();
  </script>
</body>
</html>
