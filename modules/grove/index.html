<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Grove · 私人加密译站</title>
<style>
:root{--paper:#f6f1e7;--ink:#201c17;--muted:#6b6157;--line:#d9cfbe;--card:#fbf8f1;--rubric:#8c2b1f;--blue:#2b4552}
@media(prefers-color-scheme:dark){:root{--paper:#16130f;--ink:#e9e2d4;--muted:#a79c8b;--line:#332c22;--card:#1d1913;--rubric:#d8695a;--blue:#8fb3c4}}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Songti SC",STSong,SimSun,serif;line-height:1.72}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px}.lockbox{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px}.lockbox h1{font-size:24px;margin:0 0 8px}.lockbox p{color:var(--muted);font-size:14px}.lockbox input{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;margin:10px 0}.lockbox button{padding:9px 16px;border:1px solid var(--rubric);background:var(--rubric);color:#fff;font:inherit;border-radius:3px;cursor:pointer}.err{min-height:1.6em;color:var(--rubric);font-size:13px;margin-top:10px}.app{display:none;grid-template-columns:370px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px;position:sticky;top:0;height:100vh;overflow:auto}.main{padding:28px;overflow:auto}
.topline{display:flex;gap:8px;align-items:center;justify-content:space-between}.home{font-size:12px;color:var(--muted);text-decoration:none}.home:hover{color:var(--rubric)} h1{font-size:25px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.search{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}.list{margin-top:14px;display:flex;flex-direction:column;gap:7px}.item{border:1px solid var(--line);background:var(--card);padding:10px 11px;border-radius:4px;cursor:pointer}.item:hover,.item.active{border-color:var(--rubric)}.en{font-weight:600}.zh{color:var(--rubric);font-size:14px}.meta{font-size:11px;color:var(--muted);display:flex;gap:8px;margin-top:4px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}.viewer{display:grid;grid-template-columns:1fr 1fr;gap:16px}.pane{background:var(--card);border:1px solid var(--line);border-radius:5px;min-height:70vh;overflow:auto}.pane h2{font-size:18px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)} iframe{width:100%;height:76vh;border:0;background:white}.translation{padding:16px;font-size:15px}.translation p{margin:0 0 1em}.empty{color:var(--muted);padding:18px}.note{background:#fff7df;border-left:3px solid #b58b2b;padding:10px 12px;margin-bottom:14px;color:#5f4b20}.progress{font-size:12px;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.viewer{grid-template-columns:1fr}}
</style>
</head>
<body>
<section class="lock" id="lock">
  <form class="lockbox" id="unlockForm">
    <div class="topline"><a class="home" href="../../index.html">← Ad Fontes</a><span class="progress">encrypted</span></div>
    <h1>The New Grove 私人译站</h1>
    <p>数据包已加密存放在本站。输入密码后，浏览器会在本机解密 A 字母词头、原文与中文译文。</p>
    <input id="pwd" type="password" autocomplete="current-password" placeholder="Password">
    <button type="submit">解锁</button>
    <div class="err" id="err"></div>
  </form>
</section>
<div class="app" id="app">
  <aside class="side">
    <div class="topline"><a class="home" href="../../index.html">← Ad Fontes</a><span class="progress" id="scope"></span></div>
    <h1>Private Grove Lab</h1>
    <div class="sub">The New Grove · A 字母私人翻译工作台<br>原文与译文由密码在浏览器本机解密。</div>
    <input class="search" id="q" type="search" placeholder="检索英文/中文词头">
    <div class="sub" id="stat"></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="main">
    <div class="toolbar"><span class="badge" id="entryId">未选择</span><span class="badge" id="status"></span><span class="badge" id="secure">AES-GCM</span></div>
    <div class="viewer">
      <section class="pane"><h2 id="sourceTitle">Grove 原文</h2><iframe id="srcFrame"></iframe></section>
      <section class="pane"><h2 id="transTitle">中文译文</h2><div class="translation" id="translation"><div class="empty">请选择左侧词条。</div></div></section>
    </div>
  </main>
</div>
<script>
let payload=null, entries=[], current=null;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function b64ToBytes(s){return Uint8Array.from(atob(s), c=>c.charCodeAt(0));}
async function deriveKey(password, salt, iterations){
  const base=await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
}
async function ungzip(bytes){
  if('DecompressionStream' in window){
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error('此浏览器不支持 gzip 解压。请使用新版 Chrome/Edge。');
}
async function unlock(password){
  const env=await fetch('payload.enc.json',{cache:'no-store'}).then(r=>r.json());
  const salt=b64ToBytes(env.salt), iv=b64ToBytes(env.iv), tag=b64ToBytes(env.tag), data=b64ToBytes(env.data);
  const merged=new Uint8Array(data.length+tag.length); merged.set(data); merged.set(tag,data.length);
  const key=await deriveKey(password, salt, env.iterations);
  const decrypted=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv}, key, merged));
  const plain=env.compressed==='gzip'?await ungzip(decrypted):decrypted;
  return JSON.parse(new TextDecoder().decode(plain));
}
document.getElementById('unlockForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const err=document.getElementById('err');
  err.textContent='正在解密...';
  try{
    payload=await unlock(document.getElementById('pwd').value);
    entries=payload.entries||[];
    document.getElementById('lock').style.display='none';
    document.getElementById('app').style.display='grid';
    document.getElementById('scope').textContent=(payload.scope||'')+' · '+entries.length+' entries';
    drawList();
  }catch(ex){
    err.textContent='密码不对，或浏览器不支持本地解密。';
    console.error(ex);
  }
});
function drawList(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=q?entries.filter(e=>(e.en+' '+e.zh+' '+e.status).toLowerCase().includes(q)):entries;
  document.getElementById('stat').textContent=list.length+' / '+entries.length+' entries';
  document.getElementById('list').innerHTML=list.map(e=>'<div class="item '+(current&&current.id===e.id?'active':'')+'" onclick="openEntry(\''+e.id+'\')"><div class="en">'+esc(e.en)+'</div><div class="zh">'+esc(e.zh||'未定中文词头')+'</div><div class="meta"><span>'+esc(e.id)+'</span><span>'+esc(e.status)+'</span></div></div>').join('');
}
function openEntry(id){
  current=entries.find(e=>e.id===id); drawList();
  document.getElementById('entryId').textContent=current.id;
  document.getElementById('status').textContent=current.status;
  document.getElementById('sourceTitle').textContent=current.en;
  document.getElementById('transTitle').textContent=(current.zh||'中文译文')+' / '+current.en;
  document.getElementById('srcFrame').srcdoc=payload.sources[current.source]||'<p>source missing</p>';
  const tr=(payload.translations||{})[current.id];
  if(tr){
    document.getElementById('translation').innerHTML='<div class="note">'+esc(tr.translator_note||'')+'</div><p>'+esc(tr.translation_zh||'').replace(/\n/g,'</p><p>')+'</p>';
  }else{
    document.getElementById('translation').innerHTML='<div class="empty">这条还没有中文译文。</div>';
  }
}
document.getElementById('q').addEventListener('input',drawList);
</script>
</body>
</html>
