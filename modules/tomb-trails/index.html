<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>从地下到展柜｜六馆墓葬与遗址历史脉络</title>
  <link rel="stylesheet" href="./tomb-trails.css">
  <link rel="stylesheet" href="./embedded.css">
</head>
<body data-release="tomb-trails-live-2026-08-20">
  <main class="site-shell">
    <header class="masthead">
      <p class="kicker">ARCHAEOLOGICAL PROVENANCE / SIX MUSEUMS</p>
      <h1>从地下到展柜</h1>
      <p class="dek">六馆墓葬与遗址历史脉络</p>
      <p class="intro">一页只讲一个地点。这里把墓主人、遗址性质、发现与发掘经过，以及与馆藏的关系分开写；有争议的判断保留为判断，不把推测写成结论。</p>
    </header>
    <nav class="museum-nav" aria-label="六馆筛选">
      <button class="museum-tab is-active" data-museum="all">全部六馆</button>
      <button class="museum-tab" data-museum="qinhan">秦汉馆</button>
      <button class="museum-tab" data-museum="xian">西安博物院</button>
      <button class="museum-tab" data-museum="history">陕西历史博物馆</button>
      <button class="museum-tab" data-museum="archaeology">陕西考古博物馆</button>
      <button class="museum-tab" data-museum="baoji">宝鸡青铜器博物院</button>
      <button class="museum-tab" data-museum="beilin">西安碑林博物馆</button>
    </nav>
    <section class="trail" aria-labelledby="trail-title">
      <div class="trail-head">
        <div><p class="eyebrow" id="trail-count">33 个地点</p><h2 id="trail-title">墓葬与遗址</h2></div>
        <div class="trail-controls"><button id="prev" aria-label="上一个地点">←</button><span id="position">01 / 33</span><button id="next" aria-label="下一个地点">→</button></div>
      </div>
      <div class="slides" id="slides" tabindex="0" aria-live="polite"></div>
      <p class="swipe-hint">桌面端使用左右箭头或键盘 ← →；手机端左右滑动</p>
    </section>
    <footer class="site-foot"><span>资料层：馆方、文物主管部门、考古研究机构及公开学术资料</span><span>图像来源与性质见每页图注；AI图像不作为考古现场证据</span></footer>
  </main>
  <script src="./tomb-trails.js" defer></script>
</body>
</html>
