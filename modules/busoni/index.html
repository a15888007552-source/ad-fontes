<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<title>Studia Busoniana ? ????</title>
<style>
:root{--paper:#f6f1e7;--ink:#201c17;--muted:#6b6157;--line:#d9cfbe;--card:#fbf8f1;--rubric:#8c2b1f;--shadow:rgba(60,40,20,.10)}
@media(prefers-color-scheme:dark){:root{--paper:#16130f;--ink:#e9e2d4;--muted:#a79c8b;--line:#332c22;--card:#1d1913;--rubric:#d8695a;--shadow:rgba(0,0,0,.35)}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--paper);color:var(--ink);font-family:Georgia,"Songti SC",STSong,SimSun,"Noto Serif CJK SC",serif;line-height:1.72;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.lock{min-height:100vh;display:grid;place-items:center;padding:24px}.lockbox{width:min(460px,100%);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:28px 30px;box-shadow:0 14px 36px var(--shadow)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.home{font-size:12px;color:var(--muted);text-decoration:none}.home:hover{color:var(--rubric)}.mark{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);border:1px solid currentColor;border-radius:2px;padding:.15rem .45rem}h1{font-size:25px;line-height:1.28;margin:0 0 8px;font-weight:600}.sub{margin:0 0 18px;color:var(--muted);font-size:14px}.field{display:grid;gap:9px}label{font-size:13px;color:var(--muted)}input{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:3px;padding:11px 12px;font:inherit}input:focus{outline:2px solid color-mix(in srgb,var(--rubric) 45%,transparent);outline-offset:2px}button{border:1px solid var(--rubric);background:var(--rubric);color:white;border-radius:3px;padding:9px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.68;cursor:wait}.row{display:flex;align-items:center;gap:12px;margin-top:14px}.err{min-height:1.6em;color:var(--rubric);font-size:13px}.hint{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}.noscript{max-width:460px;margin:24px auto;color:var(--rubric);font-size:14px}
</style>
</head>
<body>
<section class="lock" id="lock">
  <form class="lockbox" id="unlockForm">
    <div class="topline"><a class="home" href="../../index.html">? Ad Fontes</a><span class="mark">encrypted</span></div>
    <h1>Studia Busoniana</h1>
    <p class="sub">?????????????????????????????????</p>
    <div class="field">
      <label for="pwd">????</label>
      <input id="pwd" type="password" autocomplete="current-password" autofocus>
    </div>
    <div class="row"><button id="unlockBtn" type="submit">??</button><div class="err" id="err"></div></div>
    <p class="hint">??????????????? AES-GCM ?????</p>
  </form>
</section>
<noscript><p class="noscript">??????? JavaScript ???????</p></noscript>
<script>
const STORE_KEY='ad-fontes-busoni-password';
function b64ToBytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function deriveKey(password,salt,iterations){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function ungzip(bytes){
  if('DecompressionStream' in window){
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  throw new Error('???????? gzip ???????? Chrome?Edge ? Safari?');
}
async function unlock(password){
  const env=await fetch('payload.enc.json',{cache:'no-store'}).then(r=>r.json());
  const salt=b64ToBytes(env.salt),iv=b64ToBytes(env.iv),tag=b64ToBytes(env.tag),data=b64ToBytes(env.data);
  const merged=new Uint8Array(data.length+tag.length); merged.set(data); merged.set(tag,data.length);
  const key=await deriveKey(password,salt,env.iterations);
  const decrypted=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,merged));
  const plain=env.compressed==='gzip'?await ungzip(decrypted):decrypted;
  return new TextDecoder().decode(plain);
}
async function tryUnlock(password,manual){
  const err=document.getElementById('err');
  const btn=document.getElementById('unlockBtn');
  err.textContent='????...'; btn.disabled=true;
  try{
    const html=await unlock(password);
    sessionStorage.setItem(STORE_KEY,password);
    document.open(); document.write(html); document.close();
  }catch(ex){
    if(manual) sessionStorage.removeItem(STORE_KEY);
    err.textContent='?????????????????';
    btn.disabled=false;
    console.error(ex);
  }
}
document.getElementById('unlockForm').addEventListener('submit',(e)=>{
  e.preventDefault();
  tryUnlock(document.getElementById('pwd').value,true);
});
const saved=sessionStorage.getItem(STORE_KEY);
if(saved){document.getElementById('pwd').value=saved; tryUnlock(saved,false);}
</script>
</body>
</html>
