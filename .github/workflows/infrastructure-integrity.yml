name: AD FONTES Infrastructure Integrity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity and scholarly metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for the PR size guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run infrastructure unit checks
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run repository integrity checks
        run: |
          mkdir -p artifacts
          python scripts/repository_integrity.py \
            --base-ref "${{ github.event.pull_request.base.sha || github.event.before || '' }}" \
            --report artifacts/repository-integrity.json

      - name: Run scholarly integrity audit
        run: python scripts/scholarly_integrity.py --report artifacts/scholarly-integrity.json

      - name: Upload integrity reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ad-fontes-integrity-reports
          path: artifacts/
          if-no-files-found: warn

  museum-qa:
    name: Existing Museum QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check existing QA script syntax
        run: node --check scripts/qa.mjs

      - name: Run existing Museum QA
        run: node scripts/qa.mjs

  core-browser-smoke:
    name: Core site browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python Playwright
        run: python -m pip install --upgrade pip playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start local HTTP server
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/ad-fontes-http.log 2>&1 &
          echo $! > /tmp/ad-fontes-http.pid
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:8765/ > /dev/null \
              && curl --silent --show-error --fail http://127.0.0.1:8765/modules/europa/ > /dev/null \
              && curl --silent --show-error --fail http://127.0.0.1:8765/modules/museum-atlas/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ad-fontes-http.log
          exit 1

      - name: Run core site smoke
        run: |
          mkdir -p artifacts
          python scripts/smoke_core_site.py --output artifacts/core-site-smoke.json

      - name: Upload core smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ad-fontes-core-browser-smoke
          path: artifacts/
          if-no-files-found: warn

  museum-browser-smoke:
    name: Existing Museum Atlas browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python Playwright
        run: python -m pip install --upgrade pip playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start local HTTP server
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/ad-fontes-museum-http.log 2>&1 &
          echo $! > /tmp/ad-fontes-museum-http.pid
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:8765/modules/museum-atlas/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ad-fontes-museum-http.log
          exit 1

      - name: Run existing Museum Atlas browser smoke
        run: |
          mkdir -p artifacts
          python scripts/smoke_museum_atlas_browser.py \
            --output artifacts/museum-atlas-browser-smoke.json

      - name: Upload Museum smoke artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ad-fontes-museum-browser-smoke
          path: artifacts/
          if-no-files-found: warn

  visual-regression:
    name: Deterministic visual artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python Playwright
        run: python -m pip install --upgrade pip playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start local HTTP server
        shell: bash
        run: |
          python -m http.server 8765 > /tmp/ad-fontes-visual-http.log 2>&1 &
          echo $! > /tmp/ad-fontes-visual-http.pid
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:8765/modules/museum-atlas/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ad-fontes-visual-http.log
          exit 1

      - name: Capture homepage, Europa and Museum Atlas artifacts
        run: python scripts/visual_regression.py --output-dir artifacts/visual-regression

      - name: Upload visual artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ad-fontes-visual-regression
          path: artifacts/visual-regression/
          if-no-files-found: warn
